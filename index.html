<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Графік">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect fill='url(%23g)' width='180' height='180' rx='40'/%3E%3Cpath fill='white' d='M50 60h80v10h-80zm0 20h80v10h-80zm0 20h60v10h-60z'/%3E%3Ccircle fill='white' cx='60' cy='120' r='4'/%3E%3Ccircle fill='white' cx='80' cy='120' r='4'/%3E%3Ccircle fill='white' cx='100' cy='120' r='4'/%3E%3C/svg%3E">
<title>Графік монтажів</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-elevated: #13131a;
  --bg-card: #1a1a24;
  --border: rgba(99,102,241,0.15);
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg-primary); overflow-x: hidden; }
body { 
  font-family: 'Inter', -apple-system, sans-serif; 
  color: var(--text); 
  background: linear-gradient(135deg, #0a0a0f 0%, #13131a 50%, #0f0f16 100%);
  padding-bottom: 88px;
}

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,15,0.92);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
  padding: 56px 20px 16px;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.logo-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(99,102,241,0.3);
}

.logo-icon svg {
  width: 24px;
  height: 24px;
  color: white;
  stroke-width: 2.5;
}

.header-title {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
}

.month-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 18px;
}

.month-btn:active { transform: scale(0.95); background: var(--bg-elevated); }

.month-display {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.02em;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 16px 20px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 12px;
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--purple));
  opacity: 0.6;
}

.stat-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}

.stat-value {
  font-size: 26px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}

.stat-sub {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

.timeline {
  padding: 12px 20px 20px;
}

.day-group {
  margin-bottom: 28px;
}

.day-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding-left: 2px;
}

.day-badge {
  width: 44px;
  height: 44px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.day-badge.weekend {
  background: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(239,68,68,0.05));
  border-color: rgba(239,68,68,0.3);
}

.day-num {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}

.day-name {
  font-size: 9px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.day-info {
  flex: 1;
}

.day-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
}

.day-count {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.order-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.order-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--accent), var(--purple));
}

.order-card:active {
  transform: scale(0.98);
  border-color: var(--accent);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.order-time {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 6px;
}

.order-status {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.status-client { background: rgba(99,102,241,0.2); color: var(--accent); }
.status-repair { background: rgba(245,158,11,0.2); color: var(--warning); }
.status-delivery { background: rgba(16,185,129,0.2); color: var(--success); }

.client-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.client-phone {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.order-address {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.order-details {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.detail-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.detail-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.detail-value {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 32px rgba(99,102,241,0.4);
  cursor: pointer;
  border: none;
  z-index: 90;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.fab:active {
  transform: scale(0.92);
  box-shadow: 0 4px 16px rgba(99,102,241,0.5);
}

.fab svg {
  width: 28px;
  height: 28px;
  color: white;
  stroke-width: 2.5;
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(10px);
  z-index: 200;
  padding: 20px;
  overflow-y: auto;
}

.modal.show { display: flex; align-items: flex-start; justify-content: center; padding-top: 60px; }

.modal-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 500px;
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
}

.modal-close {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  color: var(--text-dim);
}

.form-field {
  margin-bottom: 16px;
}

.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

input[type=text], input[type=date], input[type=time], input[type=tel], input[type=number], select, textarea {
  width: 100%;
  background: var(--bg-elevated);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  transition: all 0.2s;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-card);
}

textarea { min-height: 80px; resize: vertical; }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}

.btn {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-family: 'Inter', sans-serif;
  transition: all 0.2s;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--purple));
  color: white;
  box-shadow: 0 4px 16px rgba(99,102,241,0.3);
}

.btn-primary:active {
  transform: scale(0.97);
  box-shadow: 0 2px 8px rgba(99,102,241,0.4);
}

.btn-secondary {
  background: var(--bg-elevated);
  border: 1.5px solid var(--border);
  color: var(--text-dim);
}

.btn-secondary:active {
  background: var(--bg-card);
  transform: scale(0.97);
}

.empty-state {
  text-align: center;
  padding: 60px 40px;
  color: var(--text-muted);
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.3;
}

.empty-text {
  font-size: 15px;
  font-weight: 500;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-area">
    <div class="logo-icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
    </div>
    <div class="header-title">Графік</div>
  </div>
  <div class="month-nav">
    <div class="month-btn" onclick="prevMonth()">‹</div>
    <div class="month-display" id="monthDisplay"></div>
    <div class="month-btn" onclick="nextMonth()">›</div>
  </div>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="stat-label">Замовлень</div>
    <div class="stat-value" id="totalOrders">0</div>
    <div class="stat-sub">цього місяця</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Виручка</div>
    <div class="stat-value" id="totalRevenue">0</div>
    <div class="stat-sub">грн</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Робочих днів</div>
    <div class="stat-value" id="workDays">0</div>
    <div class="stat-sub">з монтажами</div>
  </div>
</div>

<div class="timeline" id="timeline"></div>

<button class="fab" onclick="openModal()">
  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
  </svg>
</button>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">Нове замовлення</div>
      <div class="modal-close" onclick="closeModal()">×</div>
    </div>
    
    <div class="form-field">
      <div class="field-label">Дата та час</div>
      <div class="row-2">
        <input type="date" id="orderDate">
        <input type="time" id="orderTime" value="09:00">
      </div>
    </div>

    <div class="form-field">
      <div class="field-label">Клієнт</div>
      <input type="text" id="clientName" placeholder="Ім'я та прізвище">
    </div>

    <div class="form-field">
      <div class="field-label">Телефон</div>
      <input type="tel" id="clientPhone" placeholder="+380">
    </div>

    <div class="form-field">
      <div class="field-label">Адреса монтажу</div>
      <input type="text" id="address" placeholder="вул., буд., кв.">
    </div>

    <div class="form-field">
      <div class="field-label">Статус</div>
      <select id="status">
        <option value="client">В клієнта</option>
        <option value="repair">Поправка</option>
        <option value="delivery">Доставка</option>
      </select>
    </div>

    <div class="row-2">
      <div class="form-field">
        <div class="field-label">Виробник</div>
        <input type="text" id="manufacturer" placeholder="Rodos, Maksi...">
      </div>
      <div class="form-field">
        <div class="field-label">Кількість</div>
        <input type="number" id="quantity" placeholder="1" value="1">
      </div>
    </div>

    <div class="row-2">
      <div class="form-field">
        <div class="field-label">Ціна (грн)</div>
        <input type="number" id="price" placeholder="1600">
      </div>
      <div class="form-field">
        <div class="field-label">Магазин</div>
        <input type="text" id="store" placeholder="Назва">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-secondary" onclick="closeModal()">Скасувати</button>
      <button class="btn btn-primary" onclick="saveOrder()">Зберегти</button>
    </div>
  </div>
</div>

<script>
var currentMonth = new Date();
var orders = [];

var monthNames = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
var dayNames = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];

function load() {
  var saved = localStorage.getItem('schedule_orders');
  if (saved) {
    orders = JSON.parse(saved);
  }
  renderMonth();
}

function save() {
  localStorage.setItem('schedule_orders', JSON.stringify(orders));
}

function prevMonth() {
  currentMonth.setMonth(currentMonth.getMonth() - 1);
  renderMonth();
}

function nextMonth() {
  currentMonth.setMonth(currentMonth.getMonth() + 1);
  renderMonth();
}

function renderMonth() {
  var year = currentMonth.getFullYear();
  var month = currentMonth.getMonth();
  
  document.getElementById('monthDisplay').textContent = monthNames[month] + ' ' + year;
  
  var monthOrders = orders.filter(function(o) {
    var d = new Date(o.date);
    return d.getMonth() === month && d.getFullYear() === year;
  });
  
  var totalRev = 0;
  var workDays = new Set();
  monthOrders.forEach(function(o) {
    totalRev += parseFloat(o.price || 0) * parseInt(o.quantity || 1);
    workDays.add(o.date);
  });
  
  document.getElementById('totalOrders').textContent = monthOrders.length;
  document.getElementById('totalRevenue').textContent = Math.round(totalRev).toLocaleString('uk-UA');
  document.getElementById('workDays').textContent = workDays.size;
  
  var byDay = {};
  monthOrders.forEach(function(o) {
    if (!byDay[o.date]) byDay[o.date] = [];
    byDay[o.date].push(o);
  });
  
  var dates = Object.keys(byDay).sort();
  var html = '';
  
  if (dates.length === 0) {
    html = '<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-text">Поки що немає замовлень на цей місяць</div></div>';
  } else {
    dates.forEach(function(dateStr) {
      var d = new Date(dateStr + 'T00:00:00');
      var dayNum = d.getDate();
      var dayName = dayNames[d.getDay()];
      var isWeekend = d.getDay() === 0 || d.getDay() === 6;
      var dayOrders = byDay[dateStr];
      
      html += '<div class="day-group">';
      html += '<div class="day-header">';
      html += '<div class="day-badge' + (isWeekend ? ' weekend' : '') + '">';
      html += '<div class="day-num">' + dayNum + '</div>';
      html += '<div class="day-name">' + dayName + '</div>';
      html += '</div>';
      html += '<div class="day-info">';
      html += '<div class="day-title">' + formatDate(d) + '</div>';
      html += '<div class="day-count">' + dayOrders.length + ' ' + (dayOrders.length === 1 ? 'замовлення' : 'замовлень') + '</div>';
      html += '</div>';
      html += '</div>';
      
      dayOrders.forEach(function(order) {
        var statusClass = 'status-' + order.status;
        var statusText = order.status === 'client' ? 'В клієнта' : order.status === 'repair' ? 'Поправка' : 'Доставка';
        
        html += '<div class="order-card">';
        html += '<div class="order-header">';
        html += '<div class="order-time">🕐 ' + order.time + '</div>';
        html += '<div class="order-status ' + statusClass + '">' + statusText + '</div>';
        html += '</div>';
        html += '<div class="client-name">' + order.clientName + '</div>';
        html += '<div class="client-phone">📞 ' + order.clientPhone + '</div>';
        html += '<div class="order-address">📍 ' + order.address + '</div>';
        html += '<div class="order-details">';
        html += '<div class="detail-item"><div class="detail-label">Виробник</div><div class="detail-value">' + (order.manufacturer || '—') + '</div></div>';
        html += '<div class="detail-item"><div class="detail-label">Кількість</div><div class="detail-value">' + order.quantity + ' шт</div></div>';
        html += '<div class="detail-item"><div class="detail-label">Ціна</div><div class="detail-value">' + (order.price || 0) + ' грн</div></div>';
        html += '<div class="detail-item"><div class="detail-label">Магазин</div><div class="detail-value">' + (order.store || '—') + '</div></div>';
        html += '</div>';
        html += '</div>';
      });
      
      html += '</div>';
    });
  }
  
  document.getElementById('timeline').innerHTML = html;
}

function formatDate(d) {
  var day = d.getDate();
  var month = monthNames[d.getMonth()];
  return day + ' ' + month;
}

function openModal() {
  var today = new Date();
  var y = today.getFullYear();
  var m = String(today.getMonth() + 1).padStart(2, '0');
  var d = String(today.getDate()).padStart(2, '0');
  document.getElementById('orderDate').value = y + '-' + m + '-' + d;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('orderDate').value = '';
  document.getElementById('orderTime').value = '09:00';
  document.getElementById('clientName').value = '';
  document.getElementById('clientPhone').value = '';
  document.getElementById('address').value = '';
  document.getElementById('status').value = 'client';
  document.getElementById('manufacturer').value = '';
  document.getElementById('quantity').value = '1';
  document.getElementById('price').value = '';
  document.getElementById('store').value = '';
}

function saveOrder() {
  var date = document.getElementById('orderDate').value;
  var time = document.getElementById('orderTime').value;
  var clientName = document.getElementById('clientName').value;
  var clientPhone = document.getElementById('clientPhone').value;
  var address = document.getElementById('address').value;
  var status = document.getElementById('status').value;
  var manufacturer = document.getElementById('manufacturer').value;
  var quantity = document.getElementById('quantity').value;
  var price = document.getElementById('price').value;
  var store = document.getElementById('store').value;
  
  if (!date || !clientName || !clientPhone || !address) {
    alert('Заповніть обов\'язкові поля');
    return;
  }
  
  orders.push({
    date: date,
    time: time,
    clientName: clientName,
    clientPhone: clientPhone,
    address: address,
    status: status,
    manufacturer: manufacturer,
    quantity: quantity,
    price: price,
    store: store
  });
  
  save();
  closeModal();
  renderMonth();
}

load();
</script>
</body>
</html>
