<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Графік">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect fill='url(%23g)' width='180' height='180' rx='40'/%3E%3Cpath fill='white' d='M50 60h80v10h-80zm0 20h80v10h-80zm0 20h60v10h-60z'/%3E%3Ccircle fill='white' cx='60' cy='120' r='4'/%3E%3Ccircle fill='white' cx='80' cy='120' r='4'/%3E%3Ccircle fill='white' cx='100' cy='120' r='4'/%3E%3C/svg%3E">
<title>Графік монтажів</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"></script>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-elevated: #13131a;
  --bg-card: #1a1a24;
  --border: rgba(99,102,241,0.15);
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --purple: #a855f7;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg-primary); overflow-x: hidden; }
body { 
  font-family: 'Inter', -apple-system, sans-serif; 
  color: var(--text); 
  background: linear-gradient(135deg, #0a0a0f 0%, #13131a 50%, #0f0f16 100%);
  padding-bottom: 140px;
}

.auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

.auth-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 30px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.auth-title {
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 32px;
}

.auth-input {
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
}

.auth-input::placeholder {
  color: var(--text-muted);
}

.auth-btn {
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 12px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.auth-btn:active {
  transform: scale(0.98);
}

.auth-toggle {
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  margin-top: 16px;
}

.auth-toggle button {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  font-weight: 600;
  text-decoration: underline;
}

.sync-status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 8px;
  font-size: 12px;
  color: var(--success);
  margin: 8px 0;
}

.sync-dot {
  width: 6px;
  height: 6px;
  background: var(--success);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,15,0.92);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
  padding: 56px 20px 16px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.logo-area {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  flex: 1;
}

.logo-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(99,102,241,0.3);
}

.logo-icon svg {
  width: 24px;
  height: 24px;
  color: white;
  stroke-width: 2.5;
}

.header-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.user-menu {
  display: flex;
  gap: 8px;
}

.logout-btn {
  padding: 8px 16px;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  color: #ff6b6b;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.logout-btn:active {
  background: rgba(239,68,68,0.2);
}

.view-selector {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 16px;
}

.view-btn {
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.view-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--purple));
  color: white;
  border-color: transparent;
}

.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}

.month-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 18px;
}

.month-btn:active { transform: scale(0.95); background: var(--bg-elevated); }

.month-display {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.02em;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 16px 20px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 10px;
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--purple));
  opacity: 0.6;
}

.stat-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}

.stat-value {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}

.stat-sub {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
}

.timeline {
  padding: 12px 20px 20px;
}

.day-group {
  margin-bottom: 28px;
}

.day-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding-left: 2px;
}

.day-badge {
  width: 44px;
  height: 44px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.day-badge.weekend {
  background: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(239,68,68,0.05));
  border-color: rgba(239,68,68,0.3);
}

.day-num {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}

.day-name {
  font-size: 9px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.day-info {
  flex: 1;
}

.day-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
}

.day-count {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.order-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
}

.order-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--accent), var(--purple));
}

.order-card:active {
  transform: scale(0.98);
  border-color: var(--accent);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.order-time {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

.order-status {
  padding: 4px 12px;
  background: rgba(99,102,241,0.15);
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.order-status.repair {
  background: rgba(245,158,11,0.15);
  color: var(--warning);
}

.order-status.delivery {
  background: rgba(168,85,247,0.15);
  color: var(--purple);
}

.order-client {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.order-phone {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  margin-bottom: 8px;
  display: inline-block;
}

.order-address {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 12px;
  padding: 8px;
  background: rgba(0,0,0,0.2);
  border-radius: 8px;
}

.order-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.detail-item {
  background: rgba(0,0,0,0.3);
  padding: 8px;
  border-radius: 8px;
}

.detail-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 2px;
}

.detail-value {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}

.order-notes {
  font-size: 12px;
  color: var(--text-dim);
  padding: 8px;
  background: rgba(245,158,11,0.1);
  border-left: 2px solid var(--warning);
  border-radius: 4px;
}

.fab {
  position: fixed;
  bottom: 30px;
  right: 20px;
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  border: none;
  border-radius: 20px;
  color: white;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(99,102,241,0.4);
  transition: all 0.3s;
  z-index: 50;
}

.fab:active {
  transform: scale(0.92);
}

.fab-menu {
  position: fixed;
  bottom: 100px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 49;
}

.fab-item {
  width: 50px;
  height: 50px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: 20px;
  cursor: pointer;
  transition: all 0.2s;
}

.fab-item:active {
  transform: scale(0.92);
  background: var(--bg-elevated);
}

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  overflow-y: auto;
  animation: fadeIn 0.3s;
}

.modal.show {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  margin: auto;
  background: var(--bg-card);
  border-radius: 20px;
  padding: 24px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  animation: slideUp 0.3s;
}

@keyframes slideUp {
  from { transform: translateY(100px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
  color: var(--text);
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border 0.2s;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-elevated);
}

.form-textarea {
  resize: vertical;
  min-height: 80px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.modal-buttons {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

.btn {
  flex: 1;
  padding: 12px 16px;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--purple));
  color: white;
}

.btn-primary:active {
  transform: scale(0.98);
}

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text-dim);
  border: 1px solid var(--border);
}

.btn-secondary:active {
  background: rgba(0,0,0,0.2);
}

.btn-danger {
  background: rgba(239,68,68,0.15);
  color: #ff6b6b;
}

.btn-danger:active {
  background: rgba(239,68,68,0.25);
}

.printable {
  display: none;
}

@media (max-width: 600px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }
  
  .form-row {
    grid-template-columns: 1fr;
  }
}

@media print {
  body {
    background: white;
    padding: 0;
  }
  
  .printable {
    display: block !important;
  }
  
  .modal, .header, .fab, .fab-menu {
    display: none !important;
  }
}
</style>
</head>
<body>

<!-- АУТЕНТИФІКАЦІЯ -->
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-title">Графік монтажів</div>
    <div class="auth-subtitle" id="authMode">Введіть email та пароль</div>
    
    <input type="email" id="authEmail" class="auth-input" placeholder="Email">
    <input type="password" id="authPassword" class="auth-input" placeholder="Пароль">
    <button id="authSubmit" class="auth-btn">Увійти</button>
    
    <div class="auth-toggle">
      <span id="toggleText">Немає облікового запису? </span>
      <button id="toggleBtn">Зареєструватися</button>
    </div>
  </div>
</div>

<!-- ОСНОВНИЙ ІНТЕРФЕЙС -->
<div id="mainApp" style="display: none;">
  <div class="header">
    <div class="header-top">
      <div class="logo-area">
        <div class="logo-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
        </div>
        <div class="header-title">Графік</div>
      </div>
      <div class="user-menu">
        <button class="logout-btn" id="logoutBtn">Вихід</button>
      </div>
    </div>
    
    <div class="sync-status" id="syncStatus">
      <div class="sync-dot"></div>
      <span>Синхронізовано</span>
    </div>
    
    <div class="view-selector">
      <button class="view-btn active" data-view="day">День</button>
      <button class="view-btn" data-view="week">Тиждень</button>
      <button class="view-btn" data-view="month">Місяць</button>
    </div>
    
    <div class="month-nav">
      <button class="month-btn">‹</button>
      <div class="month-display" id="monthDisplay"></div>
      <button class="month-btn">›</button>
    </div>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Замовлень</div>
      <div class="stat-value" id="statOrders">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Дохід</div>
      <div class="stat-value" id="statRevenue">0 грн</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">В клієнта</div>
      <div class="stat-value" id="statClient">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Поправка</div>
      <div class="stat-value" id="statRepair">0</div>
    </div>
  </div>
  
  <div class="timeline" id="timeline"></div>
  
  <!-- FAB Меню -->
  <div class="fab-menu" id="fabMenu" style="display: none;">
    <button class="fab-item" title="Експортувати PDF" onclick="savePDF()">📄</button>
    <button class="fab-item" title="Друк" onclick="printDoc()">🖨️</button>
    <button class="fab-item" title="Поділитися" onclick="shareData()">📤</button>
  </div>
  <button class="fab" id="fabBtn">+</button>
  
  <!-- МОДАЛЬНЕ ВІКНО -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Нове замовлення</div>
      
      <input type="hidden" id="editId">
      
      <div class="form-group">
        <label class="form-label">Дата та час</label>
        <div class="form-row">
          <input type="date" id="orderDate" class="form-input">
          <input type="time" id="orderTime" class="form-input">
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">ПІБ клієнта *</label>
        <input type="text" id="clientName" class="form-input" placeholder="Ім'я та прізвище">
      </div>
      
      <div class="form-group">
        <label class="form-label">Телефон *</label>
        <input type="tel" id="clientPhone" class="form-input" placeholder="+380...">
      </div>
      
      <div class="form-group">
        <label class="form-label">Адреса *</label>
        <input type="text" id="address" class="form-input" placeholder="Вулиця, дім">
      </div>
      
      <div class="form-group">
        <label class="form-label">Статус</label>
        <select id="status" class="form-select">
          <option value="client">В клієнта</option>
          <option value="repair">Поправка</option>
          <option value="delivery">Доставка</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">Виробник</label>
        <input type="text" id="manufacturer" class="form-input" placeholder="Марка, модель">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Кількість</label>
          <input type="number" id="quantity" class="form-input" value="1" min="1">
        </div>
        <div class="form-group">
          <label class="form-label">Ціна (грн)</label>
          <input type="number" id="price" class="form-input" placeholder="0">
        </div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Магазин</label>
        <input type="text" id="store" class="form-input" placeholder="Назва магазину">
      </div>
      
      <div class="form-group">
        <label class="form-label">Нотатки</label>
        <textarea id="notes" class="form-textarea" placeholder="Додаткова інформація..."></textarea>
      </div>
      
      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeModal()">Скасувати</button>
        <button id="deleteBtn" class="btn btn-danger" onclick="deleteOrder()" style="display: none;">Видалити</button>
        <button class="btn btn-primary" onclick="saveOrder()">Зберегти</button>
      </div>
    </div>
  </div>
  
  <!-- ДРУК -->
  <div class="printable" id="printable">
    <h2>Графік монтажів: <span id="p_period"></span></h2>
    <p>Замовлень: <span id="p_orders">0</span> | Дохід: <span id="p_revenue">0</span> грн</p>
    <table border="1" cellpadding="10" style="width: 100%; margin-top: 20px;">
      <thead>
        <tr>
          <th>Дата</th>
          <th>Час</th>
          <th>Клієнт</th>
          <th>Телефон</th>
          <th>Адреса</th>
          <th>Статус</th>
          <th>Виробник</th>
          <th>К-сть</th>
          <th>Ціна</th>
          <th>Магазин</th>
        </tr>
      </thead>
      <tbody id="p_table"></tbody>
    </table>
  </div>
</div>

<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyBrgNOURd5uoMvBF7rW_ShK4yZEaeiBzCQ",
  authDomain: "grafik-montage.firebaseapp.com",
  databaseURL: "https://grafik-montage-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "grafik-montage",
  storageBucket: "grafik-montage.firebasestorage.app",
  messagingSenderId: "176843884576",
  appId: "1:176843884576:web:7e797a2bd35ad74bcb9445",
  measurementId: "G-90J8W17LNL"
};

// Ініціалізація Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let orders = [];
let currentDate = new Date();
let viewMode = 'day';
let currentUser = null;
let isRegistering = false;

const monthNames = ['Січня', 'Лютого', 'Березня', 'Квітня', 'Травня', 'Червня', 
                   'Липня', 'Серпня', 'Вересня', 'Жовтня', 'Листопада', 'Грудня'];
const dayNames = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

// ===== АУТЕНТИФІКАЦІЯ =====
document.getElementById('authSubmit').addEventListener('click', handleAuth);
document.getElementById('toggleBtn').addEventListener('click', toggleAuthMode);
document.getElementById('logoutBtn').addEventListener('click', logout);

function toggleAuthMode() {
  isRegistering = !isRegistering;
  const modeText = document.getElementById('authMode');
  const toggleText = document.getElementById('toggleText');
  const submitBtn = document.getElementById('authSubmit');
  const toggleBtn = document.getElementById('toggleBtn');
  
  if (isRegistering) {
    modeText.textContent = 'Введіть email та пароль';
    toggleText.textContent = 'Уже є аккаунт? ';
    submitBtn.textContent = 'Зареєструватися';
    toggleBtn.textContent = 'Увійти';
  } else {
    modeText.textContent = 'Введіть email та пароль';
    toggleText.textContent = 'Немає облікового запису? ';
    submitBtn.textContent = 'Увійти';
    toggleBtn.textContent = 'Зареєструватися';
  }
}

function handleAuth() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  
  if (!email || !password) {
    alert('Заповніть усі поля');
    return;
  }
  
  if (isRegistering) {
    auth.createUserWithEmailAndPassword(email, password)
      .then(() => {
        isRegistering = false;
        toggleAuthMode();
      })
      .catch(err => alert('Помилка: ' + err.message));
  } else {
    auth.signInWithEmailAndPassword(email, password)
      .catch(err => alert('Помилка: ' + err.message));
  }
}

function logout() {
  auth.signOut();
}

// ===== СПОСТЕРІГАЧ АУТЕНТИФІКАЦІЇ =====
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    
    // Завантажити дані з Firebase
    loadDataFromFirebase();
    initializeApp();
  } else {
    currentUser = null;
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
  }
});

// ===== СИНХРОНІЗАЦІЯ З FIREBASE =====
function loadDataFromFirebase() {
  const userRef = db.ref('users/' + currentUser.uid + '/orders');
  
  userRef.on('value', snapshot => {
    if (snapshot.exists()) {
      orders = Object.entries(snapshot.val()).map(([key, value]) => ({
        id: parseInt(key),
        ...value
      }));
    } else {
      orders = [];
    }
    renderView();
    showSyncStatus();
  });
}

function save() {
  if (!currentUser) return;
  
  const userRef = db.ref('users/' + currentUser.uid + '/orders');
  const ordersObj = {};
  
  orders.forEach(order => {
    ordersObj[order.id.toString()] = {
      date: order.date,
      time: order.time,
      clientName: order.clientName,
      clientPhone: order.clientPhone,
      address: order.address,
      status: order.status,
      manufacturer: order.manufacturer || '',
      quantity: order.quantity,
      price: order.price || 0,
      store: order.store || '',
      notes: order.notes || ''
    };
  });
  
  userRef.set(ordersObj).catch(err => console.error('Помилка збереження:', err));
}

function showSyncStatus() {
  const statusEl = document.getElementById('syncStatus');
  statusEl.style.opacity = '1';
  
  setTimeout(() => {
    statusEl.style.opacity = '0.5';
  }, 2000);
}

// ===== БАЗОВІ ФУНКЦІЇ =====
function initializeApp() {
  // Обробники кнопок перегляду
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      viewMode = this.getAttribute('data-view');
      currentDate = new Date();
      renderView();
    });
  });
  
  // Навігація по місяцям
  const navBtns = document.querySelectorAll('.month-btn');
  navBtns[0].addEventListener('click', () => {
    currentDate.setDate(currentDate.getDate() - 1);
    renderView();
  });
  navBtns[1].addEventListener('click', () => {
    currentDate.setDate(currentDate.getDate() + 1);
    renderView();
  });
  
  // FAB меню
  const fabBtn = document.getElementById('fabBtn');
  const fabMenu = document.getElementById('fabMenu');
  fabBtn.addEventListener('click', () => {
    fabMenu.style.display = fabMenu.style.display === 'none' ? 'flex' : 'none';
  });
  
  // Закриття FAB при натисканні на пункт
  document.querySelectorAll('.fab-item').forEach(item => {
    item.addEventListener('click', () => {
      fabMenu.style.display = 'none';
    });
  });
  
  // Модальне вікно
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });
  
  // Кнопка додавання замовлення
  fabBtn.addEventListener('dblclick', () => {
    fabMenu.style.display = 'none';
    openModal();
  });
  
  renderView();
}

function renderView() {
  if (viewMode === 'day') renderDayView();
  else if (viewMode === 'week') renderWeekView();
  else renderMonthView();
}

function renderDayView() {
  const dateKey = formatDateKey(currentDate);
  const dayOrders = orders.filter(o => o.date === dateKey).sort((a, b) => a.time.localeCompare(b.time));
  
  updateMonthDisplay();
  updateStats(dayOrders);
  
  let html = '';
  const dayBadgeClass = currentDate.getDay() === 0 || currentDate.getDay() === 6 ? 'weekend' : '';
  
  html += `<div class="day-group">
    <div class="day-header">
      <div class="day-badge ${dayBadgeClass}">
        <div class="day-num">${currentDate.getDate()}</div>
        <div class="day-name">${dayNames[currentDate.getDay()]}</div>
      </div>
      <div class="day-info">
        <div class="day-title">${formatDateFull(currentDate)}</div>
        <div class="day-count">${dayOrders.length} замовлень${dayOrders.length === 1 ? 'я' : ''}</div>
      </div>
    </div>`;
  
  if (dayOrders.length > 0) {
    dayOrders.forEach(order => {
      html += renderOrderCard(order);
    });
  } else {
    html += '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Немає замовлень на цей день</p>';
  }
  
  html += '</div>';
  document.getElementById('timeline').innerHTML = html;
}

function renderWeekView() {
  const weekStart = new Date(currentDate);
  weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
  
  updateMonthDisplay();
  
  let html = '';
  let weekOrders = [];
  
  for (let i = 0; i < 7; i++) {
    const date = new Date(weekStart);
    date.setDate(date.getDate() + i);
    const dateKey = formatDateKey(date);
    const dayOrders = orders.filter(o => o.date === dateKey).sort((a, b) => a.time.localeCompare(b.time));
    weekOrders = weekOrders.concat(dayOrders);
    
    const dayBadgeClass = date.getDay() === 0 || date.getDay() === 6 ? 'weekend' : '';
    
    html += `<div class="day-group">
      <div class="day-header">
        <div class="day-badge ${dayBadgeClass}">
          <div class="day-num">${date.getDate()}</div>
          <div class="day-name">${dayNames[date.getDay()]}</div>
        </div>
        <div class="day-info">
          <div class="day-title">${formatDateFull(date)}</div>
          <div class="day-count">${dayOrders.length} замовлень${dayOrders.length === 1 ? 'я' : ''}</div>
        </div>
      </div>`;
    
    if (dayOrders.length > 0) {
      dayOrders.forEach(order => {
        html += renderOrderCard(order);
      });
    }
    
    html += '</div>';
  }
  
  updateStats(weekOrders);
  document.getElementById('timeline').innerHTML = html;
}

function renderMonthView() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  
  updateMonthDisplay();
  
  const monthOrders = orders.filter(o => {
    const d = new Date(o.date);
    return d.getMonth() === month && d.getFullYear() === year;
  });
  
  updateStats(monthOrders);
  
  let html = '';
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  
  let dayOfMonth = 1;
  
  for (let week = 0; week < 6; week++) {
    for (let day = 0; day < 7; day++) {
      if (week === 0 && day < firstDay) continue;
      if (dayOfMonth > daysInMonth) break;
      
      const date = new Date(year, month, dayOfMonth);
      const dateKey = formatDateKey(date);
      const dayOrders = orders.filter(o => o.date === dateKey).sort((a, b) => a.time.localeCompare(b.time));
      const dayBadgeClass = date.getDay() === 0 || date.getDay() === 6 ? 'weekend' : '';
      
      html += `<div class="day-group">
        <div class="day-header">
          <div class="day-badge ${dayBadgeClass}">
            <div class="day-num">${dayOfMonth}</div>
            <div class="day-name">${dayNames[date.getDay()]}</div>
          </div>
          <div class="day-info">
            <div class="day-title">${formatDateFull(date)}</div>
            <div class="day-count">${dayOrders.length} замовлень${dayOrders.length === 1 ? 'я' : ''}</div>
          </div>
        </div>`;
      
      if (dayOrders.length > 0) {
        dayOrders.forEach(order => {
          html += renderOrderCard(order);
        });
      }
      
      html += '</div>';
      dayOfMonth++;
    }
  }
  
  document.getElementById('timeline').innerHTML = html;
}

function renderOrderCard(order) {
  const statusMap = { 'client': 'В клієнта', 'repair': 'Поправка', 'delivery': 'Доставка' };
  const statusClass = order.status;
  
  let html = `<div class="order-card" onclick="editOrder(${order.id})">
    <div class="order-header">
      <div class="order-time">${order.time}</div>
      <div class="order-status ${statusClass}">${statusMap[order.status]}</div>
    </div>
    <div class="order-client">${order.clientName}</div>
    <a href="tel:${order.clientPhone}" class="order-phone">${order.clientPhone}</a>
    <div class="order-address">${order.address}</div>
    <div class="order-details">
      <div class="detail-item">
        <div class="detail-label">Виробник</div>
        <div class="detail-value">${order.manufacturer || '—'}</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Кількість</div>
        <div class="detail-value">${order.quantity} шт</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Ціна</div>
        <div class="detail-value">${order.price || 0} грн</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Магазин</div>
        <div class="detail-value">${order.store || '—'}</div>
      </div>
    </div>`;
  
  if (order.notes) {
    html += `<div class="order-notes">📝 ${order.notes}</div>`;
  }
  
  html += '</div>';
  return html;
}

function updateStats(filteredOrders) {
  const totalOrders = filteredOrders.length;
  const totalRevenue = filteredOrders.reduce((sum, o) => sum + (parseFloat(o.price || 0) * parseInt(o.quantity || 1)), 0);
  const clientCount = filteredOrders.filter(o => o.status === 'client').length;
  const repairCount = filteredOrders.filter(o => o.status === 'repair').length;
  
  document.getElementById('statOrders').textContent = totalOrders;
  document.getElementById('statRevenue').textContent = Math.round(totalRevenue).toLocaleString('uk-UA') + ' грн';
  document.getElementById('statClient').textContent = clientCount;
  document.getElementById('statRepair').textContent = repairCount;
}

function updateMonthDisplay() {
  const today = new Date();
  let displayText = '';
  
  if (viewMode === 'day') {
    displayText = formatDateFull(currentDate);
  } else if (viewMode === 'week') {
    const weekStart = new Date(currentDate);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    displayText = formatDateShort(weekStart) + ' - ' + formatDateShort(weekEnd);
  } else {
    displayText = monthNames[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
  }
  
  document.getElementById('monthDisplay').textContent = displayText;
}

function formatDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function formatDateFull(d) {
  const day = d.getDate();
  const month = monthNames[d.getMonth()];
  return day + ' ' + month;
}

function formatDateShort(d) {
  const day = d.getDate();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  return day + '.' + month;
}

function openModal() {
  document.getElementById('modalTitle').textContent = 'Нове замовлення';
  document.getElementById('editId').value = '';
  document.getElementById('deleteBtn').style.display = 'none';
  
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth() + 1).padStart(2, '0');
  const d = String(today.getDate()).padStart(2, '0');
  
  document.getElementById('orderDate').value = y + '-' + m + '-' + d;
  document.getElementById('orderTime').value = '09:00';
  document.getElementById('clientName').value = '';
  document.getElementById('clientPhone').value = '+380';
  document.getElementById('address').value = '';
  document.getElementById('status').value = 'client';
  document.getElementById('manufacturer').value = '';
  document.getElementById('quantity').value = '1';
  document.getElementById('price').value = '';
  document.getElementById('store').value = '';
  document.getElementById('notes').value = '';
  
  document.getElementById('modal').classList.add('show');
}

function editOrder(id) {
  const order = orders.find(o => o.id === id);
  if (!order) return;
  
  document.getElementById('modalTitle').textContent = 'Редагувати замовлення';
  document.getElementById('editId').value = id;
  document.getElementById('deleteBtn').style.display = 'block';
  
  document.getElementById('orderDate').value = order.date;
  document.getElementById('orderTime').value = order.time;
  document.getElementById('clientName').value = order.clientName;
  document.getElementById('clientPhone').value = order.clientPhone;
  document.getElementById('address').value = order.address;
  document.getElementById('status').value = order.status;
  document.getElementById('manufacturer').value = order.manufacturer || '';
  document.getElementById('quantity').value = order.quantity;
  document.getElementById('price').value = order.price;
  document.getElementById('store').value = order.store || '';
  document.getElementById('notes').value = order.notes || '';
  
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function saveOrder() {
  const editId = document.getElementById('editId').value;
  const date = document.getElementById('orderDate').value;
  const time = document.getElementById('orderTime').value;
  const clientName = document.getElementById('clientName').value;
  const clientPhone = document.getElementById('clientPhone').value;
  const address = document.getElementById('address').value;
  const status = document.getElementById('status').value;
  const manufacturer = document.getElementById('manufacturer').value;
  const quantity = document.getElementById('quantity').value;
  const price = document.getElementById('price').value;
  const store = document.getElementById('store').value;
  const notes = document.getElementById('notes').value;
  
  if (!date || !clientName || !clientPhone || !address) {
    alert('Заповніть обов\'язкові поля');
    return;
  }
  
  const orderData = {
    date, time, clientName, clientPhone, address, status, manufacturer, quantity, price, store, notes
  };
  
  if (editId) {
    const idx = orders.findIndex(o => o.id == editId);
    if (idx !== -1) {
      orderData.id = parseInt(editId);
      orders[idx] = orderData;
    }
  } else {
    const maxId = Math.max(...orders.map(o => o.id), 0);
    orderData.id = maxId + 1;
    orders.push(orderData);
  }
  
  save();
  closeModal();
  renderView();
}

function deleteOrder() {
  const editId = document.getElementById('editId').value;
  if (!editId) return;
  
  if (confirm('Видалити це замовлення?')) {
    orders = orders.filter(o => o.id != editId);
    save();
    closeModal();
    renderView();
  }
}

function preparePrintData() {
  let filtered = [];
  let displayText = '';
  
  if (viewMode === 'day') {
    const dayStr = formatDateKey(currentDate);
    filtered = orders.filter(o => o.date === dayStr);
    displayText = formatDateFull(currentDate);
  } else if (viewMode === 'week') {
    const weekStart = new Date(currentDate);
    weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    filtered = orders.filter(o => {
      const od = new Date(o.date + 'T00:00:00');
      return od >= weekStart && od <= weekEnd;
    });
    displayText = formatDateShort(weekStart) + ' - ' + formatDateShort(weekEnd);
  } else {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    filtered = orders.filter(o => {
      const d = new Date(o.date);
      return d.getMonth() === month && d.getFullYear() === year;
    });
    displayText = monthNames[month] + ' ' + year;
  }
  
  const totalRev = filtered.reduce((sum, o) => sum + (parseFloat(o.price || 0) * parseInt(o.quantity || 1)), 0);
  
  document.getElementById('p_period').textContent = displayText;
  document.getElementById('p_orders').textContent = filtered.length;
  document.getElementById('p_revenue').textContent = Math.round(totalRev).toLocaleString('uk-UA');
  
  let tbody = '';
  filtered.sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  
  filtered.forEach(o => {
    const statusText = o.status === 'client' ? 'В клієнта' : o.status === 'repair' ? 'Поправка' : 'Доставка';
    tbody += '<tr>';
    tbody += '<td>' + o.date + '</td>';
    tbody += '<td>' + o.time + '</td>';
    tbody += '<td>' + o.clientName + '</td>';
    tbody += '<td>' + o.clientPhone + '</td>';
    tbody += '<td>' + o.address + '</td>';
    tbody += '<td>' + statusText + '</td>';
    tbody += '<td>' + (o.manufacturer || '—') + '</td>';
    tbody += '<td>' + o.quantity + '</td>';
    tbody += '<td>' + (o.price || 0) + '</td>';
    tbody += '<td>' + (o.store || '—') + '</td>';
    tbody += '</tr>';
  });
  
  document.getElementById('p_table').innerHTML = tbody;
}

function printDoc() {
  preparePrintData();
  window.print();
}

function savePDF() {
  preparePrintData();
  const opt = {
    margin: 10,
    filename: 'Графік_монтажів.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
  };
  html2pdf().set(opt).from(document.getElementById('printable')).save();
}

  let filtered = [];
  
  if (viewMode === 'day') {
    const dayStr = formatDateKey(currentDate);

    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);
    filtered = orders.filter(o => {
      const od = new Date(o.date + 'T00:00:00');
      return od >= weekStart && od <= weekEnd;
    });
  } else {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    filtered = orders.filter(o => {
      const d = new Date(o.date);
      return d.getMonth() === month && d.getFullYear() === year;
    });
  }
  
  filtered.sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  
  filtered.forEach((o, i) => {
    text += (i+1) + '. ' + o.date + ' ' + o.time + '\n';
    text += '   ' + o.clientName + ' - ' + o.clientPhone + '\n';
    text += '   ' + o.address + '\n';
    text += '   ' + (o.manufacturer || '—') + ', ' + o.quantity + ' шт, ' + o.price + ' грн\n\n';
  });
  
  if (navigator.share) {
    navigator.share({ title: 'Графік монтажів', text: text }).catch(() => {});
  } else {
    alert('Функція поділитися не підтримується');
  }
}
</script>
</body>
</html>
